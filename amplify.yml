version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run check
        - npm run check:content
        - npm run build:amplify
  artifacts:
    baseDirectory: dist/client
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
